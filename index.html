<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .msg { font-size: 1.2rem; color: #334155; font-weight: 500; }
    </style>
    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRec4FiB1LDcWTuEe2XEJE5CS3scf8_tXe0y9z2QFyGvd5Ejvcd4OAb-jrb8WRfxzS6o412KjBgLPfj/pub?gid=1997163139&single=true&output=csv';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const cardId = urlParams.get('id');

            if (!cardId) {
                document.body.innerHTML = '<div class="msg">لم يتم تحديد رقم الكارت</div>';
                return;
            }

            fetch(CSV_URL)
                .then(res => {
                    if (!res.ok) throw new Error('فشل جلب الملف');
                    return res.text();
                })
                .then(text => {
                    const lines = text.split(/\r?\n/);
                    let targetUrl = null;

                    for (let line of lines) {
                        // تقسيم الأعمدة مع تنظيف الفواصل وعلامات التنصيص
                        const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                        if (cols[0] === cardId.trim()) {
                            targetUrl = cols[1];
                            break;
                        }
                    }

                    if (targetUrl && (targetUrl.startsWith('http://') || targetUrl.startsWith('https://'))) {
                        window.location.replace(targetUrl);
                    } else {
                        document.body.innerHTML = '<div class="msg">هذا الكارت غير مفعّل بعد أو الرابط غير صحيح</div>';
                    }
                })
                .catch(() => {
                    document.body.innerHTML = '<div class="msg">حدث خطأ أثناء تحميل البيانات</div>';
                });
        });
    </script>
</head>
<body>
    <div class="msg">...جاري تحويلك</div>
</body>
</html>
