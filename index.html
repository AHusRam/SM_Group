<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .msg { font-size: 1.2rem; color: #334155; }
    </style>
    <script>
        const SHEET_ID = '17RbMt1KHlVIn7_k7vqIXDwV5FTPbgOvP9ynbOFrmS1U';
        const GID = '1997163139';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const cardId = urlParams.get('id');

            if (!cardId) {
                document.body.innerHTML = '<div class="msg">لم يتم تحديد رقم الكارت</div>';
                return;
            }

            const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

            fetch(csvUrl)
                .then(res => {
                    if (!res.ok) throw new Error('Network error');
                    return res.text();
                })
                .then(text => {
                    const lines = text.split(/\r\n|\n/);
                    let targetUrl = null;

                    for (let line of lines) {
                        const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                        if (cols[0] === cardId.trim()) {
                            targetUrl = cols[1];
                            break;
                        }
                    }

                    if (targetUrl && (targetUrl.startsWith('http://') || targetUrl.startsWith('https://'))) {
                        window.location.replace(targetUrl);
                    } else {
                        document.body.innerHTML = '<div class="msg">هذا الكارت غير مفعّل بعد أو الرابط غير صالح</div>';
                    }
                })
                .catch(err => {
                    document.body.innerHTML = '<div class="msg">حدث خطأ في جلب البيانات</div>';
                });
        });
    </script>
</head>
<body>
    <div class="msg">...جاري تحويلك</div>
</body>
</html>
