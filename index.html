<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>تفعيل الكارت</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            text-align: right;
        }
        h2 { margin-top: 0; color: #0f172a; font-size: 1.25rem; text-align: center; }
        p.subtitle { color: #64748b; font-size: 0.88rem; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #334155; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #2563eb; }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .status-box { text-align: center; font-size: 1.1rem; color: #334155; }
    </style>
    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRec4FiB1LDcWTuEe2XEJE5CS3scf8_tXe0y9z2QFyGvd5Ejvcd4OAb-jrb8WRfxzS6o412KjBgLPfj/pub?gid=1997163139&single=true&output=csv';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXJH2apbxTXdWlw5fnYHvSu095kMUHPI9JdbdL49elqsw7fYzZwqRcp-K8wyzABrqRDw/exec';

        let currentCardId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentCardId = urlParams.get('id');

            if (!currentCardId) {
                showMessage('خطأ: لم يتم تحديد رقم الكارت');
                return;
            }

            const freshUrl = CSV_URL + '&t=' + new Date().getTime();

            fetch(freshUrl, { cache: 'no-store' })
                .then(res => res.text())
                .then(text => {
                    const lines = text.split(/\r?\n/);
                    let targetUrl = '';

                    for (let line of lines) {
                        const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                        if (cols[0] === currentCardId) {
                            targetUrl = cols[1] || '';
                            break;
                        }
                    }

                    // إذا كان الكارت مفعلاً وله رابط حقيقي مختلف عن الوضع الافتراضي
                    if (targetUrl && targetUrl.startsWith('http') && !targetUrl.includes('google.com') && targetUrl !== 'setup') {
                        window.location.replace(targetUrl);
                    } else {
                        // إظهار الفورم للعميل لتهيئة الكارت لأول مرة
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('setup-form').style.display = 'block';
                        document.getElementById('card-id-display').innerText = currentCardId;
                    }
                })
                .catch(() => {
                    showMessage('حدث خطأ أثناء تحميل البيانات');
                });
        });

        function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = 'جاري الحفظ وتفعيل الكارت...';

            const payload = {
                id: currentCardId,
                client_name: document.getElementById('client_name').value,
                usage: document.getElementById('usage').value,
                url: document.getElementById('target_url').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showMessage('تم تفعيل الكارت بنجاح! جاري تحويلك الآن...');
                setTimeout(() => {
                    window.location.replace(payload.url);
                }, 1500);
            })
            .catch(() => {
                alert('حدث خطأ أثناء الاتصال، يرجى المحاولة ثانية.');
                btn.disabled = false;
                btn.innerText = 'تفعيل الكارت';
            });
        }

        function showMessage(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('setup-form').style.display = 'none';
            const status = document.getElementById('status-message');
            status.style.display = 'block';
            status.innerText = msg;
        }
    </script>
</head>
<body>
    <div class="container">
        <div id="loading" class="status-box">...جاري التحقق من الكارت</div>
        <div id="status-message" class="status-box" style="display: none;"></div>

        <form id="setup-form" style="display: none;" onsubmit="submitForm(event)">
            <h2>تهيئة الكارت (#<span id="card-id-display"></span>)</h2>
            <p class="subtitle">أدخل بيانات المكان لربط الكارت بالرابط الخاص بك</p>

            <div class="form-group">
                <label>اسم المحل / النشاط</label>
                <input type="text" id="client_name" required placeholder="مثال: كافيه العمدة">
            </div>

            <div class="form-group">
                <label>نوع الاستخدام</label>
                <select id="usage" required>
                    <option value="Google Review">تقييم جوجل (Google Review)</option>
                    <option value="Menu">المينيو الإلكتروني (Menu)</option>
                    <option value="InstaPay">إنستاباي / دفع إلكتروني</option>
                    <option value="Social Media">صفحة سوشيال ميديا</option>
                    <option value="Other">أخرى</option>
                </select>
            </div>

            <div class="form-group">
                <label>الرابط المطلوب فتحه</label>
                <input type="url" id="target_url" required placeholder="https://...">
            </div>

            <button type="submit" id="save-btn">تفعيل الكارت</button>
        </form>
    </div>
</body>
</html>
